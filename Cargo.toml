[package]
name = "sister_other_paranoia_korean_patcher"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
default = ["patcher"]
patcher = [
    "dep:include_assets",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:unity-asset-binary",
    "dep:unity-asset-core",
    "dep:unity-asset-write",
]
ui-check = []

[build-dependencies]
winres = "0.1"

[dependencies]
native-windows-gui = "1.0.13"
include_assets = { version = "1.0", features = ["zstd"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.11", optional = true }
unity-asset-binary = { git = "https://github.com/Latias94/unity-asset.git", optional = true }
unity-asset-core = { git = "https://github.com/Latias94/unity-asset.git", optional = true }
unity-asset-write = { git = "https://github.com/Latias94/unity-asset.git", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
