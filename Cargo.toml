[package]
name = "sister_other_paranoia_korean_patcher"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[build-dependencies]
winres = "0.1"

[dependencies]
native-windows-gui = "1.0.13"
include_assets = { version = "1.0", features = ["zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
unity-asset-binary = { git = "https://github.com/Latias94/unity-asset.git" }
unity-asset-core = { git = "https://github.com/Latias94/unity-asset.git" }
unity-asset-write = { git = "https://github.com/Latias94/unity-asset.git" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
